import os

# The remote execution mode runs on any host: the tests drive a mock helper.
if "AArch64" not in config.root.targets:
    config.unsupported = True

config.substitutions.append(
    (
        "%exegesis_mock_helper",
        '"' + config.python_executable + '" '
        + os.path.join(
            config.llvm_src_root, "utils", "exegesis-remote", "exegesis-mock-helper.py"
        ),
    )
)
